# Headscale — serveur de controle du mesh Neo (acces distant aux box).
# Derriere le Traefik de Coolify : TLS termine par le proxy, headscale ecoute en HTTP.
server_url: https://mesh.neo.157.180.43.90.sslip.io
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

# Relais DERP publics de Tailscale : NAT traversal sans coturn a heberger.
derp:
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  auto_update_enabled: true
  update_frequency: 3h

disable_check_updates: true
ephemeral_node_inactivity_timeout: 30m

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true

log:
  format: text
  level: info

# Politique d'acces : les ops atteignent les box, les box ne se voient jamais.
policy:
  mode: file
  path: /etc/headscale/policy.hujson

dns:
  magic_dns: false
  override_local_dns: false
  nameservers:
    global: []

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"
